<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>上傳影片</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    </head>
    <body>
        <h1>上傳影片</h1>
        <label
            >API母網址: <input type="text" id="apiBase" value="http://localhost:3000" size="40"
        /></label>
        <br /><br />

        <input type="file" id="videoFile" name="file" accept="video/*" />
        <button id="uploadBtn">上傳</button>

        <p id="status"></p>

        <div id="result" hidden>
            <p>訊息: <span id="message"></span></p>
            <p>ID: <span id="id"></span></p>
            <p>影片連結: <a id="videoLink" href="#" target="_blank"></a></p>
            <div id="qrcode"></div>
        </div>

        <script>
            const uploadBtn = document.getElementById("uploadBtn");
            const videoFile = document.getElementById("videoFile");
            const apiBase = document.getElementById("apiBase");
            const status = document.getElementById("status");
            const result = document.getElementById("result");
            const messageEl = document.getElementById("message");
            const idEl = document.getElementById("id");
            const videoLink = document.getElementById("videoLink");
            const qrcodeDiv = document.getElementById("qrcode");

            uploadBtn.addEventListener("click", async () => {
                const file = videoFile.files[0];
                if (!file) {
                    status.textContent = "Please select a video file first.";
                    return;
                }

                const base = apiBase.value.replace(/\/$/, "");

                const formData = new FormData();
                formData.append("file", file);

                status.textContent = "Uploading...";
                result.hidden = true;

                try {
                    const res = await fetch(base + "/", {
                        method: "POST",
                        body: formData,
                    });

                    if (!res.ok) {
                        throw new Error("Upload failed: " + res.status);
                    }

                    const data = await res.json();

                    status.textContent = "Upload complete.";
                    messageEl.textContent = data.message;
                    idEl.textContent = data.id;

                    const videoUrl = base + "/" + data.id;
                    videoLink.href = videoUrl;
                    videoLink.textContent = videoUrl;

                    qrcodeDiv.innerHTML = "";
                    new QRCode(qrcodeDiv, videoUrl);

                    result.hidden = false;
                } catch (err) {
                    status.textContent = "Error: " + err.message;
                }
            });
        </script>
    </body>
</html>
