<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>上傳影片</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <style>
            :root {
                --bg: #d4d4d4;
                --card: #ffffff;
                --fg: #111111;
                --muted: #737373;
                --line: #111111;
                --hairline: #cccccc;
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
                border-radius: 0;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                display: flex;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    "Geist", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif;
                font-size: 14px;
                line-height: 1.3;
                -webkit-font-smoothing: antialiased;
            }

            /* auto margins center the card but still let it scroll if the
               viewport is shorter than the result state.
               fit-content means the card is only as wide as the form until the
               result panel appears, then it grows rightward around the QR. */
            .card {
                display: flex;
                width: fit-content;
                max-width: 100%;
                margin: auto;
                background: var(--card);
                border: 2px solid var(--line);
            }

            .panel {
                padding: 18px 22px;
            }

            .panel-form {
                flex: 0 0 360px;
                max-width: 100%;
            }

            h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.01em;
            }

            .subtitle {
                margin: 3px 0 0;
                padding-bottom: 12px;
                border-bottom: 2px solid var(--line);
                color: var(--muted);
                font-size: 11px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            .field {
                margin-top: 12px;
            }

            label {
                display: block;
                margin-bottom: 4px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            input[type="text"],
            input[type="file"] {
                width: 100%;
                padding: 7px 10px;
                font: inherit;
                font-size: 13px;
                line-height: 1.3;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                outline: none;
            }

            input[type="text"] {
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            input[type="text"]:focus,
            input[type="file"]:focus-visible {
                box-shadow: inset 0 0 0 2px var(--line);
            }

            input[type="file"]::file-selector-button {
                margin-right: 8px;
                padding: 3px 10px;
                font: inherit;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--fg);
                background: var(--bg);
                border: 1px solid var(--line);
                cursor: pointer;
            }

            button {
                width: 100%;
                margin-top: 14px;
                padding: 9px 16px;
                font: inherit;
                font-size: 12px;
                line-height: 1.3;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--card);
                background: var(--fg);
                border: 2px solid var(--line);
                cursor: pointer;
            }

            button:hover:not(:disabled) {
                color: var(--fg);
                background: var(--card);
            }

            button:disabled {
                color: var(--muted);
                background: var(--bg);
                cursor: default;
            }

            #status {
                margin: 8px 0 0;
                min-height: 15px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                color: var(--muted);
            }

            #status.error {
                color: var(--fg);
                font-weight: 500;
            }

            #status.error::before {
                content: "! ";
            }

            #status.done::before {
                content: "✓ ";
            }

            /* capped so a long URL in the meta table can't stretch the card */
            #result {
                flex: 0 0 auto;
                max-width: 420px;
                border-left: 2px solid var(--line);
                text-align: center;
            }

            /* QR: pure black on white. The plate padding is the quiet zone —
               keep it at 12px or more or cameras struggle to lock on. */
            .qr-plate {
                display: inline-block;
                padding: 16px;
                background: #fff;
                border: 1px solid var(--line);
            }

            #qrcode img,
            #qrcode canvas {
                display: block;
            }

            .scan-hint {
                margin: 8px 0 12px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                letter-spacing: 0.04em;
                color: var(--muted);
            }

            .meta {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0;
                margin: 0;
                text-align: left;
                font-size: 12px;
                border-top: 1px solid var(--hairline);
            }

            .meta dt {
                padding: 4px 10px 4px 0;
                border-bottom: 1px solid var(--hairline);
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 10px;
                line-height: 1.4;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                white-space: nowrap;
            }

            .meta dd {
                margin: 0;
                padding: 4px 0;
                border-bottom: 1px solid var(--hairline);
                overflow-wrap: anywhere;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.4;
            }

            .meta a {
                color: inherit;
                text-decoration-thickness: 1px;
                text-underline-offset: 2px;
            }

            /* narrow windows: stack, and let the QR shrink to fit */
            @media (max-width: 800px) {
                .card {
                    flex-direction: column;
                    width: 100%;
                    max-width: 400px;
                }

                .panel-form {
                    flex: 0 0 auto;
                }

                #result {
                    border-left: none;
                    border-top: 2px solid var(--line);
                    padding-top: 14px;
                }

                #qrcode img,
                #qrcode canvas {
                    width: 100%;
                    height: auto;
                    max-width: 320px;
                }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <section class="panel panel-form">
                <h1>上傳影片</h1>
                <p class="subtitle">上傳後會產生可掃描的影片連結</p>

                <div class="field">
                    <label for="apiBase">API 母網址</label>
                    <input
                        type="text"
                        id="apiBase"
                        value="http://localhost:3000"
                        spellcheck="false"
                    />
                </div>

                <div class="field">
                    <label for="videoFile">影片檔案</label>
                    <input type="file" id="videoFile" name="file" accept="video/*" />
                </div>

                <button id="uploadBtn">上傳</button>
                <p id="status"></p>
            </section>

            <section class="panel" id="result" hidden>
                <div class="qr-plate"><div id="qrcode"></div></div>
                <p class="scan-hint">用手機相機掃描即可觀看</p>
                <dl class="meta">
                    <dt>訊息</dt>
                    <dd id="message"></dd>
                    <dt>ID</dt>
                    <dd id="id"></dd>
                    <dt>連結</dt>
                    <dd><a id="videoLink" href="#" target="_blank" rel="noopener"></a></dd>
                </dl>
            </section>
        </main>

        <script>
            const uploadBtn = document.getElementById("uploadBtn");
            const videoFile = document.getElementById("videoFile");
            const apiBase = document.getElementById("apiBase");
            const status = document.getElementById("status");
            const result = document.getElementById("result");
            const messageEl = document.getElementById("message");
            const idEl = document.getElementById("id");
            const videoLink = document.getElementById("videoLink");
            const qrcodeDiv = document.getElementById("qrcode");

            function setStatus(text, kind) {
                status.textContent = text;
                status.className = kind || "";
            }

            uploadBtn.addEventListener("click", async () => {
                const file = videoFile.files[0];
                if (!file) {
                    setStatus("請先選擇影片檔案。", "error");
                    return;
                }

                const base = apiBase.value.replace(/\/$/, "");

                const formData = new FormData();
                formData.append("file", file);

                setStatus("上傳中…");
                uploadBtn.disabled = true;
                result.hidden = true;

                try {
                    const res = await fetch(base + "/", {
                        method: "POST",
                        body: formData,
                    });

                    if (!res.ok) {
                        throw new Error("Upload failed: " + res.status);
                    }

                    const data = await res.json();

                    setStatus("上傳完成。", "done");
                    messageEl.textContent = data.message;
                    idEl.textContent = data.id;

                    const videoUrl = base + "/" + data.id;
                    videoLink.href = videoUrl;
                    videoLink.textContent = videoUrl;

                    qrcodeDiv.innerHTML = "";
                    new QRCode(qrcodeDiv, {
                        text: videoUrl,
                        // sized for scanning from ~0.7 m: phone cameras need
                        // roughly distance/10 of QR width, so ~7 cm ≈ 265 CSS px
                        // minimum — 340 leaves headroom on scaled displays.
                        width: 340,
                        height: 340,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H,
                    });

                    result.hidden = false;
                } catch (err) {
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    uploadBtn.disabled = false;
                }
            });
        </script>
    </body>
</html>
