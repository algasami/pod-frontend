<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>上傳影片</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <style>
            :root {
                --bg: #d4d4d4;
                --card: #ffffff;
                --fg: #111111;
                --muted: #737373;
                --line: #111111;
                --hairline: #cccccc;
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
                border-radius: 0;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                display: flex;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    "Geist",
                    "Noto Sans TC",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: 14px;
                line-height: 1.3;
                -webkit-font-smoothing: antialiased;
            }

            /* auto margins center the card but still let it scroll if the
               viewport is shorter than the result state.
               fit-content means the card is only as wide as the form until the
               result panel appears, then it grows rightward around the QR. */
            .card {
                display: flex;
                width: fit-content;
                max-width: 100%;
                margin: auto;
                background: var(--card);
                border: 2px solid var(--line);
            }

            .panel {
                padding: 18px 22px;
            }

            .panel-form {
                flex: 0 0 360px;
                max-width: 100%;
            }

            h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.01em;
            }

            .subtitle {
                margin: 3px 0 0;
                padding-bottom: 12px;
                border-bottom: 2px solid var(--line);
                color: var(--muted);
                font-size: 11px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            .field {
                margin-top: 12px;
            }

            label {
                display: block;
                margin-bottom: 4px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            input[type="text"],
            input[type="file"] {
                width: 100%;
                padding: 7px 10px;
                font: inherit;
                font-size: 13px;
                line-height: 1.3;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                outline: none;
            }

            input[type="text"] {
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            input[type="text"]:focus,
            input[type="file"]:focus-visible {
                box-shadow: inset 0 0 0 2px var(--line);
            }

            input[type="file"]::file-selector-button {
                margin-right: 8px;
                padding: 3px 10px;
                font: inherit;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--fg);
                background: var(--bg);
                border: 1px solid var(--line);
                cursor: pointer;
            }

            button {
                width: 100%;
                margin-top: 14px;
                padding: 9px 16px;
                font: inherit;
                font-size: 12px;
                line-height: 1.3;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--card);
                background: var(--fg);
                border: 2px solid var(--line);
                cursor: pointer;
            }

            button:hover:not(:disabled) {
                color: var(--fg);
                background: var(--card);
            }

            button:disabled {
                color: var(--muted);
                background: var(--bg);
                cursor: default;
            }

            #status {
                margin: 8px 0 0;
                min-height: 15px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                color: var(--muted);
            }

            #status.error {
                color: var(--fg);
                font-weight: 500;
            }

            #status.error::before {
                content: "! ";
            }

            #status.done::before {
                content: "✓ ";
            }

            /* capped so a long URL in the meta table can't stretch the card */
            #result {
                flex: 0 0 auto;
                max-width: 420px;
                border-left: 2px solid var(--line);
                text-align: center;
            }

            /* QR: pure black on white. The plate padding is the quiet zone —
               keep it at 12px or more or cameras struggle to lock on. */
            .qr-plate {
                display: inline-block;
                padding: 16px;
                background: #fff;
                border: 1px solid var(--line);
                cursor: pointer;
                user-select: none;
            }

            #qrcode img,
            #qrcode canvas {
                display: block;
                transition: filter 0.15s linear;
            }

            .qr-plate.blurred #qrcode img,
            .qr-plate.blurred #qrcode canvas {
                filter: blur(14px);
            }

            /* secondary action: outline, not the solid black of the main button */
            .btn-toggle {
                width: auto;
                margin: 0 0 12px;
                padding: 5px 14px;
                font-size: 11px;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
            }

            .btn-toggle:hover:not(:disabled) {
                color: var(--card);
                background: var(--fg);
            }

            .scan-hint {
                margin: 8px 0 8px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                letter-spacing: 0.04em;
                color: var(--muted);
            }

            .meta {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0;
                margin: 0;
                text-align: left;
                font-size: 12px;
                border-top: 1px solid var(--hairline);
            }

            .meta dt {
                padding: 4px 10px 4px 0;
                border-bottom: 1px solid var(--hairline);
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 10px;
                line-height: 1.4;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                white-space: nowrap;
            }

            .meta dd {
                margin: 0;
                padding: 4px 0;
                border-bottom: 1px solid var(--hairline);
                overflow-wrap: anywhere;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.4;
            }

            .meta a {
                color: inherit;
                text-decoration-thickness: 1px;
                text-underline-offset: 2px;
            }

            /* --- source picker + recorder --- */

            .seg {
                display: flex;
                margin-top: 14px;
                border: 1px solid var(--line);
            }

            .seg button {
                width: 50%;
                margin: 0;
                padding: 6px 8px;
                font-size: 11px;
                color: var(--fg);
                background: var(--card);
                border: none;
            }

            .seg button + button {
                border-left: 1px solid var(--line);
            }

            .seg button[aria-selected="true"] {
                color: var(--card);
                background: var(--fg);
            }

            select {
                width: 100%;
                padding: 7px 10px;
                font: inherit;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 12px;
                line-height: 1.3;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                outline: none;
            }

            select:focus {
                box-shadow: inset 0 0 0 2px var(--line);
            }

            select:disabled {
                color: var(--muted);
                background: var(--bg);
            }

            /* the 16:9 box holds its shape before a stream arrives, so the card
               doesn't jump the moment the camera connects */
            .preview-wrap {
                position: relative;
                margin-top: 12px;
                aspect-ratio: 16 / 9;
                background: var(--fg);
                border: 1px solid var(--line);
            }

            #preview {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .preview-wrap.idle::after {
                content: "尚未連接";
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            .rec-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 8px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                letter-spacing: 0.06em;
                color: var(--muted);
            }

            .rec-dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                margin-right: 6px;
                background: var(--hairline);
                border-radius: 50%;
                vertical-align: -1px;
            }

            .rec-bar.live {
                color: var(--fg);
            }

            .rec-bar.live .rec-dot {
                background: #cc0000;
                animation: rec-pulse 1.2s steps(1, end) infinite;
            }

            @keyframes rec-pulse {
                50% {
                    opacity: 0.25;
                }
            }

            /* secondary action: outline rather than the solid black of a primary */
            .btn-line {
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
            }

            .btn-line:hover:not(:disabled) {
                color: var(--card);
                background: var(--fg);
            }

            /* narrow windows: stack, and let the QR shrink to fit */
            @media (max-width: 800px) {
                .card {
                    flex-direction: column;
                    width: 100%;
                    max-width: 400px;
                }

                .panel-form {
                    flex: 0 0 auto;
                }

                #result {
                    border-left: none;
                    border-top: 2px solid var(--line);
                    padding-top: 14px;
                }

                #qrcode img,
                #qrcode canvas {
                    width: 100%;
                    height: auto;
                    max-width: 320px;
                }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <section class="panel panel-form">
                <h1>上傳影片</h1>
                <p class="subtitle">上傳後會產生可掃描的影片連結</p>

                <div class="field">
                    <label for="apiBase">API 母網址</label>
                    <input
                        type="text"
                        id="apiBase"
                        value="https://pod-backend.algasami.com"
                        spellcheck="false"
                    />
                </div>

                <div class="seg">
                    <button id="tabRecord" type="button" aria-selected="true">錄影</button>
                    <button id="tabFile" type="button" aria-selected="false">上傳檔案</button>
                </div>

                <div id="paneRecord">
                    <div class="field">
                        <label for="videoDevice">視訊來源</label>
                        <select id="videoDevice"></select>
                    </div>

                    <div class="field">
                        <label for="audioDevice">音訊來源</label>
                        <select id="audioDevice"></select>
                    </div>

                    <div class="preview-wrap idle">
                        <video id="preview" muted playsinline></video>
                    </div>

                    <div class="rec-bar">
                        <span><span class="rec-dot"></span><span id="recState">待機</span></span>
                        <span id="recTime">00:00</span>
                    </div>

                    <button id="connectBtn" class="btn-line" type="button">連接相機</button>
                    <button id="recordBtn" type="button" disabled>開始錄影</button>
                </div>

                <div id="paneFile" hidden>
                    <div class="field">
                        <label for="videoFile">影片檔案</label>
                        <input type="file" id="videoFile" name="file" accept="video/*" />
                    </div>

                    <button id="uploadBtn" type="button">上傳</button>
                </div>

                <p id="status"></p>
            </section>

            <section class="panel" id="result" hidden>
                <div class="qr-plate"><div id="qrcode"></div></div>
                <p class="scan-hint">用手機相機掃描即可觀看</p>
                <button id="blurBtn" class="btn-toggle" type="button" aria-pressed="false">
                    隱藏 QR
                </button>
                <dl class="meta">
                    <dt>訊息</dt>
                    <dd id="message"></dd>
                    <dt>ID</dt>
                    <dd id="id"></dd>
                    <dt>連結</dt>
                    <dd><a id="videoLink" href="#" target="_blank" rel="noopener"></a></dd>
                </dl>
            </section>
        </main>

        <script>
            const apiBase = document.getElementById("apiBase");
            const status = document.getElementById("status");
            const result = document.getElementById("result");
            const messageEl = document.getElementById("message");
            const idEl = document.getElementById("id");
            const videoLink = document.getElementById("videoLink");
            const qrcodeDiv = document.getElementById("qrcode");
            const qrPlate = document.querySelector(".qr-plate");
            const blurBtn = document.getElementById("blurBtn");

            const tabRecord = document.getElementById("tabRecord");
            const tabFile = document.getElementById("tabFile");
            const paneRecord = document.getElementById("paneRecord");
            const paneFile = document.getElementById("paneFile");

            const videoDevice = document.getElementById("videoDevice");
            const audioDevice = document.getElementById("audioDevice");
            const preview = document.getElementById("preview");
            const previewWrap = document.querySelector(".preview-wrap");
            const recBar = document.querySelector(".rec-bar");
            const recState = document.getElementById("recState");
            const recTime = document.getElementById("recTime");
            const connectBtn = document.getElementById("connectBtn");
            const recordBtn = document.getElementById("recordBtn");

            const uploadBtn = document.getElementById("uploadBtn");
            const videoFile = document.getElementById("videoFile");

            const LS_VIDEO = "pod.videoDeviceId";
            const LS_AUDIO = "pod.audioDeviceId";

            // MP4 first, always: the QR is meant to be scanned with a phone, and
            // iOS Safari will not play a VP8/VP9 WebM. WebM is only a fallback so
            // recording still works on browsers without an MP4 encoder.
            const MIME_CANDIDATES = [
                'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
                "video/mp4;codecs=h264,aac",
                "video/mp4",
                "video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus",
                "video/webm",
            ];

            let stream = null;
            let recorder = null;
            let chunks = [];
            let timerId = null;
            let startedAt = 0;

            function setStatus(text, kind) {
                status.textContent = text;
                status.className = kind || "";
            }

            function setBlurred(on) {
                qrPlate.classList.toggle("blurred", on);
                blurBtn.setAttribute("aria-pressed", String(on));
                blurBtn.textContent = on ? "顯示 QR" : "隱藏 QR";
            }

            function toggleBlur() {
                setBlurred(!qrPlate.classList.contains("blurred"));
            }

            blurBtn.addEventListener("click", toggleBlur);
            // the plate is a mouse shortcut for the same action; keyboard and
            // screen-reader users get it through blurBtn
            qrPlate.addEventListener("click", toggleBlur);

            function showTab(record) {
                tabRecord.setAttribute("aria-selected", String(record));
                tabFile.setAttribute("aria-selected", String(!record));
                paneRecord.hidden = !record;
                paneFile.hidden = record;
            }

            tabRecord.addEventListener("click", () => showTab(true));
            tabFile.addEventListener("click", () => showTab(false));

            function pickMime() {
                if (typeof MediaRecorder === "undefined") return "";
                return MIME_CANDIDATES.find((t) => MediaRecorder.isTypeSupported(t)) || "";
            }

            function extFor(type) {
                return type.includes("mp4") ? "mp4" : "webm";
            }

            function formatSize(bytes) {
                const mb = bytes / 1048576;
                return mb >= 1024 ? (mb / 1024).toFixed(2) + " GB" : mb.toFixed(1) + " MB";
            }

            function stamp() {
                const d = new Date();
                const p = (n) => String(n).padStart(2, "0");
                return (
                    d.getFullYear() +
                    p(d.getMonth() + 1) +
                    p(d.getDate()) +
                    "-" +
                    p(d.getHours()) +
                    p(d.getMinutes()) +
                    p(d.getSeconds())
                );
            }

            // ---- upload + QR, shared by the recorder and the file picker ----

            async function uploadFile(file) {
                const base = apiBase.value.replace(/\/$/, "");

                const formData = new FormData();
                formData.append("file", file);

                setStatus("上傳中… " + formatSize(file.size));
                result.hidden = true;

                const res = await fetch(base + "/", {
                    method: "POST",
                    body: formData,
                });

                if (!res.ok) {
                    throw new Error("Upload failed: " + res.status);
                }

                const data = await res.json();

                messageEl.textContent = data.message;
                idEl.textContent = data.id;

                const videoUrl = base + "/" + data.id;
                videoLink.href = videoUrl;
                videoLink.textContent = videoUrl;

                qrcodeDiv.innerHTML = "";
                setBlurred(false);
                new QRCode(qrcodeDiv, {
                    text: videoUrl,
                    // sized for scanning from ~0.7 m: phone cameras need
                    // roughly distance/10 of QR width, so ~7 cm ≈ 265 CSS px
                    // minimum — 340 leaves headroom on scaled displays.
                    width: 340,
                    height: 340,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H,
                });

                result.hidden = false;
                return data;
            }

            // ---- device list ----

            function fillSelect(sel, list, fallbackName, key) {
                const want = sel.value || localStorage.getItem(key) || "";
                sel.innerHTML = "";

                if (!list.length) {
                    const o = document.createElement("option");
                    o.value = "";
                    o.textContent = "找不到裝置";
                    sel.append(o);
                    return;
                }

                list.forEach((d, i) => {
                    const o = document.createElement("option");
                    o.value = d.deviceId;
                    // labels stay blank until the first getUserMedia grant
                    o.textContent = d.label || fallbackName + " " + (i + 1);
                    sel.append(o);
                });

                if (want && list.some((d) => d.deviceId === want)) sel.value = want;
            }

            async function refreshDevices() {
                let devices = [];
                try {
                    devices = await navigator.mediaDevices.enumerateDevices();
                } catch {
                    return;
                }
                fillSelect(
                    videoDevice,
                    devices.filter((d) => d.kind === "videoinput"),
                    "視訊裝置",
                    LS_VIDEO,
                );
                fillSelect(
                    audioDevice,
                    devices.filter((d) => d.kind === "audioinput"),
                    "音訊裝置",
                    LS_AUDIO,
                );
            }

            // after connecting, point the selects at what we actually got — the
            // browser may have ignored our request and handed back a default
            function syncSelectsToStream() {
                const v = stream.getVideoTracks()[0];
                const a = stream.getAudioTracks()[0];
                if (v && v.getSettings().deviceId) {
                    videoDevice.value = v.getSettings().deviceId;
                    localStorage.setItem(LS_VIDEO, videoDevice.value);
                }
                if (a && a.getSettings().deviceId) {
                    audioDevice.value = a.getSettings().deviceId;
                    localStorage.setItem(LS_AUDIO, audioDevice.value);
                }
            }

            // ---- connect / disconnect ----

            function disconnect() {
                if (stream) {
                    stream.getTracks().forEach((t) => t.stop());
                    stream = null;
                }
                preview.srcObject = null;
                previewWrap.classList.add("idle");
                connectBtn.textContent = "連接相機";
                recordBtn.disabled = true;
                recState.textContent = "待機";
            }

            async function connect() {
                disconnect();

                const v = videoDevice.value;
                const a = audioDevice.value;

                setStatus("連接中…");
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        ...(v ? { deviceId: { exact: v } } : {}),
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 },
                    },
                    audio: {
                        ...(a ? { deviceId: { exact: a } } : {}),
                        // Chrome's voice processing is tuned for calls and wrecks
                        // podcast audio — take the raw capture instead
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });

                preview.srcObject = stream;
                preview.play().catch(() => {});
                previewWrap.classList.remove("idle");

                await refreshDevices();
                syncSelectsToStream();

                connectBtn.textContent = "中斷連接";
                recordBtn.disabled = false;

                const s = stream.getVideoTracks()[0].getSettings();
                const mime = pickMime();
                const fmt = mime ? extFor(mime).toUpperCase() : "無編碼器";
                setStatus(
                    "已連接 " +
                        (s.width || "?") +
                        "×" +
                        (s.height || "?") +
                        " @" +
                        Math.round(s.frameRate || 0) +
                        "fps · " +
                        fmt,
                );
            }

            connectBtn.addEventListener("click", async () => {
                if (stream) {
                    disconnect();
                    setStatus("已中斷連接。");
                    return;
                }
                connectBtn.disabled = true;
                try {
                    await connect();
                } catch (err) {
                    disconnect();
                    setStatus("無法連接：" + err.message, "error");
                } finally {
                    connectBtn.disabled = false;
                }
            });

            // swapping source mid-session (Pocket 4 out, phone webcam in) just
            // re-acquires against the new selection
            async function onDeviceChanged(sel, key) {
                localStorage.setItem(key, sel.value);
                if (!stream) return;
                try {
                    await connect();
                } catch (err) {
                    disconnect();
                    setStatus("無法切換來源：" + err.message, "error");
                }
            }

            videoDevice.addEventListener("change", () => onDeviceChanged(videoDevice, LS_VIDEO));
            audioDevice.addEventListener("change", () => onDeviceChanged(audioDevice, LS_AUDIO));

            // ---- recording ----

            function tick() {
                const s = Math.floor((Date.now() - startedAt) / 1000);
                const p = (n) => String(n).padStart(2, "0");
                recTime.textContent = p(Math.floor(s / 60)) + ":" + p(s % 60);
            }

            function startRecording() {
                const mimeType = pickMime();
                if (!mimeType) {
                    setStatus("此瀏覽器不支援錄影。", "error");
                    return;
                }

                chunks = [];
                recorder = new MediaRecorder(stream, {
                    mimeType,
                    videoBitsPerSecond: 6000000,
                    audioBitsPerSecond: 128000,
                });
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size) chunks.push(e.data);
                };
                recorder.onerror = (e) => {
                    setStatus("錄影錯誤：" + ((e.error && e.error.message) || "unknown"), "error");
                };
                recorder.onstop = onRecordingStopped;
                // a timeslice keeps chunks flowing instead of building one giant
                // buffer, and limits what a mid-take crash can lose
                recorder.start(1000);

                startedAt = Date.now();
                recTime.textContent = "00:00";
                timerId = setInterval(tick, 250);

                recBar.classList.add("live");
                recState.textContent = "錄影中";
                recordBtn.textContent = "停止錄影";
                connectBtn.disabled = true;
                videoDevice.disabled = true;
                audioDevice.disabled = true;
                setStatus("錄影中…");
            }

            async function onRecordingStopped() {
                clearInterval(timerId);
                recBar.classList.remove("live");
                recState.textContent = "待機";
                recordBtn.textContent = "開始錄影";
                recordBtn.disabled = true;

                const type = recorder.mimeType || pickMime() || "video/webm";
                const ext = extFor(type);
                const blob = new Blob(chunks, { type });
                chunks = [];

                try {
                    if (!blob.size) throw new Error("錄影內容是空的");
                    await uploadFile(
                        new File([blob], "recording-" + stamp() + "." + ext, { type }),
                    );
                    setStatus(
                        ext === "mp4" ? "上傳完成。" : "上傳完成（WebM — iPhone 可能無法播放）。",
                        "done",
                    );
                } catch (err) {
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    recordBtn.disabled = !stream;
                    connectBtn.disabled = false;
                    videoDevice.disabled = false;
                    audioDevice.disabled = false;
                }
            }

            recordBtn.addEventListener("click", () => {
                if (recorder && recorder.state === "recording") {
                    setStatus("處理中…");
                    recordBtn.disabled = true;
                    recorder.stop();
                } else if (stream) {
                    startRecording();
                }
            });

            // ---- file picker (unchanged behaviour, now sharing uploadFile) ----

            uploadBtn.addEventListener("click", async () => {
                const file = videoFile.files[0];
                if (!file) {
                    setStatus("請先選擇影片檔案。", "error");
                    return;
                }

                uploadBtn.disabled = true;
                try {
                    await uploadFile(file);
                    setStatus("上傳完成。", "done");
                } catch (err) {
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    uploadBtn.disabled = false;
                }
            });

            // ---- init ----

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                // getUserMedia needs a secure context: file:// will not do
                connectBtn.disabled = true;
                showTab(false);
                setStatus("無法存取相機：請用 http://localhost 或 HTTPS 開啟本頁。", "error");
            } else {
                navigator.mediaDevices.addEventListener("devicechange", refreshDevices);
                refreshDevices().then(() => {
                    if (!videoDevice.options[0] || !videoDevice.options[0].textContent.trim())
                        return;
                    if (!videoDevice.value) setStatus("按「連接相機」以授權並列出裝置。");
                });
            }
        </script>
    </body>
</html>
