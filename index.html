<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>上傳影片</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <style>
            :root {
                --bg: #d4d4d4;
                --card: #ffffff;
                --fg: #111111;
                --muted: #737373;
                --line: #111111;
                --hairline: #cccccc;
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
                border-radius: 0;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                display: flex;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    "Geist",
                    "Noto Sans TC",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: 14px;
                line-height: 1.3;
                -webkit-font-smoothing: antialiased;
            }

            /* auto margins center the card but still let it scroll if the
               viewport is shorter than the result state.
               fit-content means the card is only as wide as the form until the
               result panel appears, then it grows rightward around the QR. */
            .card {
                display: flex;
                width: fit-content;
                max-width: 100%;
                margin: auto;
                background: var(--card);
                border: 2px solid var(--line);
            }

            .panel {
                padding: 18px 22px;
            }

            .panel-form {
                flex: 0 0 360px;
                max-width: 100%;
            }

            h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.01em;
            }

            .subtitle {
                margin: 3px 0 0;
                padding-bottom: 12px;
                border-bottom: 2px solid var(--line);
                color: var(--muted);
                font-size: 11px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            .field {
                margin-top: 12px;
            }

            label {
                display: block;
                margin-bottom: 4px;
                line-height: 1.2;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            input[type="text"],
            input[type="file"] {
                width: 100%;
                padding: 7px 10px;
                font: inherit;
                font-size: 13px;
                line-height: 1.3;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                outline: none;
            }

            input[type="text"] {
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
            }

            input[type="text"]:focus,
            input[type="file"]:focus-visible {
                box-shadow: inset 0 0 0 2px var(--line);
            }

            input[type="file"]::file-selector-button {
                margin-right: 8px;
                padding: 3px 10px;
                font: inherit;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--fg);
                background: var(--bg);
                border: 1px solid var(--line);
                cursor: pointer;
            }

            button {
                width: 100%;
                margin-top: 14px;
                padding: 9px 16px;
                font: inherit;
                font-size: 12px;
                line-height: 1.3;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--card);
                background: var(--fg);
                border: 2px solid var(--line);
                cursor: pointer;
            }

            button:hover:not(:disabled) {
                color: var(--fg);
                background: var(--card);
            }

            button:disabled {
                color: var(--muted);
                background: var(--bg);
                cursor: default;
            }

            #status {
                margin: 8px 0 0;
                min-height: 15px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                color: var(--muted);
            }

            #status.error {
                color: var(--fg);
                font-weight: 500;
            }

            #status.error::before {
                content: "! ";
            }

            #status.done::before {
                content: "✓ ";
            }

            .keyinfo {
                margin: 6px 0 0;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.3;
                color: var(--muted);
                /* a fingerprint is one unbreakable token wider than the field */
                overflow-wrap: anywhere;
            }

            .keyinfo.error {
                color: var(--fg);
                font-weight: 500;
            }

            .keyinfo.error::before {
                content: "! ";
            }

            .key-row {
                display: flex;
                gap: 8px;
                margin-top: 6px;
            }

            .key-row button {
                flex: 1 1 0;
            }

            /* capped so a long URL in the meta table can't stretch the card */
            #result {
                flex: 0 0 auto;
                max-width: 420px;
                border-left: 2px solid var(--line);
                text-align: center;
            }

            /* QR: pure black on white. The plate padding is the quiet zone —
               keep it at 12px or more or cameras struggle to lock on. */
            .qr-plate {
                display: inline-block;
                padding: 16px;
                background: #fff;
                border: 1px solid var(--line);
                cursor: pointer;
                user-select: none;
            }

            #qrcode img,
            #qrcode canvas {
                display: block;
                transition: filter 0.15s linear;
            }

            .qr-plate.blurred #qrcode img,
            .qr-plate.blurred #qrcode canvas {
                filter: blur(14px);
            }

            /* secondary action: outline, not the solid black of the main button */
            .btn-toggle {
                width: auto;
                margin: 0 0 12px;
                padding: 5px 14px;
                font-size: 11px;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
            }

            .btn-toggle:hover:not(:disabled) {
                color: var(--card);
                background: var(--fg);
            }

            .scan-hint {
                margin: 8px 0 8px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.25;
                letter-spacing: 0.04em;
                color: var(--muted);
            }

            .meta {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0;
                margin: 0;
                text-align: left;
                font-size: 12px;
                border-top: 1px solid var(--hairline);
            }

            .meta dt {
                padding: 4px 10px 4px 0;
                border-bottom: 1px solid var(--hairline);
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 10px;
                line-height: 1.4;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                white-space: nowrap;
            }

            .meta dd {
                margin: 0;
                padding: 4px 0;
                border-bottom: 1px solid var(--hairline);
                overflow-wrap: anywhere;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                line-height: 1.4;
            }

            .meta a {
                color: inherit;
                text-decoration-thickness: 1px;
                text-underline-offset: 2px;
            }

            /* --- source picker + recorder --- */

            .seg {
                display: flex;
                margin-top: 14px;
                border: 1px solid var(--line);
            }

            .seg button {
                width: 50%;
                margin: 0;
                padding: 6px 8px;
                font-size: 11px;
                color: var(--fg);
                background: var(--card);
                border: none;
            }

            .seg button + button {
                border-left: 1px solid var(--line);
            }

            .seg button[aria-selected="true"] {
                color: var(--card);
                background: var(--fg);
            }

            select {
                width: 100%;
                padding: 7px 10px;
                font: inherit;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 12px;
                line-height: 1.3;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                outline: none;
            }

            select:focus {
                box-shadow: inset 0 0 0 2px var(--line);
            }

            select:disabled {
                color: var(--muted);
                background: var(--bg);
            }

            /* the fallback shape holds before a stream arrives, so the card
               doesn't jump the moment the camera connects; connect() then swaps
               in whatever the camera actually delivers */
            .preview-wrap {
                position: relative;
                margin-top: 12px;
                aspect-ratio: var(--preview-ar, 16 / 9);
                background: var(--fg);
                border: 1px solid var(--line);
            }

            #preview {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .preview-wrap.idle::after {
                content: "尚未連接";
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            .rec-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 8px;
                font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
                font-size: 11px;
                letter-spacing: 0.06em;
                color: var(--muted);
            }

            .rec-dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                margin-right: 6px;
                background: var(--hairline);
                border-radius: 50%;
                vertical-align: -1px;
            }

            .rec-bar.live {
                color: var(--fg);
            }

            .rec-bar.live .rec-dot {
                background: #cc0000;
                animation: rec-pulse 1.2s steps(1, end) infinite;
            }

            @keyframes rec-pulse {
                50% {
                    opacity: 0.25;
                }
            }

            .rec-bar.warn {
                color: #cc0000;
            }

            /* the cap needs to be visible at a glance mid-take, not just readable
               in the timer text */
            .rec-track {
                height: 4px;
                margin-top: 6px;
                background: var(--bg);
                border: 1px solid var(--hairline);
            }

            .rec-fill {
                width: 0;
                height: 100%;
                background: var(--fg);
                transition: width 0.25s linear;
            }

            .rec-bar.warn ~ .rec-track .rec-fill {
                background: #cc0000;
            }

            .toggles {
                display: flex;
                gap: 18px;
                margin-top: 14px;
                padding-top: 12px;
                border-top: 1px solid var(--hairline);
            }

            /* overrides the uppercase muted block-label default */
            .check {
                display: flex;
                align-items: center;
                gap: 7px;
                margin: 0;
                font-size: 11px;
                letter-spacing: 0.04em;
                text-transform: none;
                color: var(--fg);
                cursor: pointer;
            }

            .check input {
                width: 14px;
                height: 14px;
                margin: 0;
                accent-color: var(--fg);
                cursor: pointer;
            }

            /* the region the backend will actually deliver: the whole frame,
               or the centred 9:16 slice once the take is flagged vertical. The
               watermark preview sits inside it so its offsets stay truthful
               against the crop rather than against the padded camera frame. */
            .crop-frame {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .crop-frame.vertical {
                inset: 0 auto 0 50%;
                transform: translateX(-50%);
                aspect-ratio: 9 / 16;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.65) inset;
            }

            /* mirrors the server-side overlay geometry exactly: 10% of frame
               width, 1.67% margin, top-right — see WATERMARK_WIDTH_RATIO and
               WATERMARK_MARGIN_RATIO in the backend config */
            .wm-preview {
                position: absolute;
                right: 1.67%;
                top: 1.67%;
                width: 10%;
                pointer-events: none;
            }

            /* secondary action: outline rather than the solid black of a primary */
            .btn-line {
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
            }

            .btn-line:hover:not(:disabled) {
                color: var(--card);
                background: var(--fg);
            }

            /* narrow windows: stack, and let the QR shrink to fit */
            @media (max-width: 800px) {
                .card {
                    flex-direction: column;
                    width: 100%;
                    max-width: 400px;
                }

                .panel-form {
                    flex: 0 0 auto;
                }

                #result {
                    border-left: none;
                    border-top: 2px solid var(--line);
                    padding-top: 14px;
                }

                #qrcode img,
                #qrcode canvas {
                    width: 100%;
                    height: auto;
                    max-width: 320px;
                }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <section class="panel panel-form">
                <h1>上傳影片</h1>
                <p class="subtitle">上傳後會產生可掃描的影片連結</p>

                <div class="field">
                    <label for="apiBase">API 母網址</label>
                    <input
                        type="text"
                        id="apiBase"
                        value="https://pod-backend.algasami.com"
                        spellcheck="false"
                    />
                </div>

                <div class="field">
                    <label for="identityFile">上傳金鑰（ssh-keygen 產生的私鑰檔）</label>
                    <input type="file" id="identityFile" />
                    <p id="identityState" class="keyinfo"></p>
                    <div class="key-row">
                        <button id="identityTest" class="btn-line" type="button">測試連線</button>
                        <button id="identityClear" class="btn-line" type="button">移除金鑰</button>
                    </div>
                </div>

                <div class="seg">
                    <button id="tabRecord" type="button" aria-selected="true">錄影</button>
                    <button id="tabFile" type="button" aria-selected="false">上傳檔案</button>
                </div>

                <div id="paneRecord">
                    <div class="field">
                        <label for="videoDevice">視訊來源</label>
                        <select id="videoDevice"></select>
                    </div>

                    <div class="field">
                        <label for="audioDevice">音訊來源</label>
                        <select id="audioDevice"></select>
                    </div>

                    <div class="preview-wrap idle">
                        <video id="preview" muted playsinline></video>
                        <div id="cropFrame" class="crop-frame">
                            <img
                                id="wmPreview"
                                class="wm-preview"
                                src="resources/logo_text_only.png"
                                alt=""
                                hidden
                            />
                        </div>
                    </div>

                    <canvas id="scaler" hidden></canvas>

                    <div class="rec-bar">
                        <span><span class="rec-dot"></span><span id="recState">待機</span></span>
                        <span id="recTime">00:00 / 01:00</span>
                    </div>

                    <div class="rec-track"><div class="rec-fill" id="recFill"></div></div>

                    <button id="connectBtn" class="btn-line" type="button">連接相機</button>
                    <button id="recordBtn" type="button" disabled>開始錄影</button>
                </div>

                <div id="paneFile" hidden>
                    <div class="field">
                        <label for="videoFile">影片檔案</label>
                        <input type="file" id="videoFile" name="file" accept="video/*" />
                    </div>

                    <button id="uploadBtn" type="button">上傳</button>
                </div>

                <div class="toggles">
                    <label class="check">
                        <input type="checkbox" id="optWatermark" />
                        <span>浮水印</span>
                    </label>
                    <label class="check">
                        <input type="checkbox" id="optVertical" />
                        <span>直式 9:16</span>
                    </label>
                </div>

                <p id="status"></p>
            </section>

            <section class="panel" id="result" hidden>
                <div class="qr-plate"><div id="qrcode"></div></div>
                <p class="scan-hint">用手機相機掃描即可觀看</p>
                <button id="blurBtn" class="btn-toggle" type="button" aria-pressed="false">
                    隱藏 QR
                </button>
                <dl class="meta">
                    <dt>訊息</dt>
                    <dd id="message"></dd>
                    <dt>ID</dt>
                    <dd id="id"></dd>
                    <dt>連結</dt>
                    <dd><a id="videoLink" href="#" target="_blank" rel="noopener"></a></dd>
                </dl>
            </section>
        </main>

        <script>
            const apiBase = document.getElementById("apiBase");
            const status = document.getElementById("status");
            const result = document.getElementById("result");
            const messageEl = document.getElementById("message");
            const idEl = document.getElementById("id");
            const videoLink = document.getElementById("videoLink");
            const qrcodeDiv = document.getElementById("qrcode");
            const qrPlate = document.querySelector(".qr-plate");
            const blurBtn = document.getElementById("blurBtn");

            const tabRecord = document.getElementById("tabRecord");
            const tabFile = document.getElementById("tabFile");
            const paneRecord = document.getElementById("paneRecord");
            const paneFile = document.getElementById("paneFile");

            const videoDevice = document.getElementById("videoDevice");
            const audioDevice = document.getElementById("audioDevice");
            const preview = document.getElementById("preview");
            const previewWrap = document.querySelector(".preview-wrap");
            const recBar = document.querySelector(".rec-bar");
            const recState = document.getElementById("recState");
            const recTime = document.getElementById("recTime");
            const recFill = document.getElementById("recFill");
            const connectBtn = document.getElementById("connectBtn");
            const recordBtn = document.getElementById("recordBtn");

            const uploadBtn = document.getElementById("uploadBtn");
            const videoFile = document.getElementById("videoFile");
            const optWatermark = document.getElementById("optWatermark");
            const optVertical = document.getElementById("optVertical");
            const cropFrame = document.getElementById("cropFrame");
            const scaler = document.getElementById("scaler");
            const wmPreview = document.getElementById("wmPreview");

            const identityFile = document.getElementById("identityFile");
            const identityState = document.getElementById("identityState");
            const identityTest = document.getElementById("identityTest");
            const identityClear = document.getElementById("identityClear");

            const LS_IDENTITY = "pod.identity";
            const LS_VIDEO = "pod.videoDeviceId";
            const LS_AUDIO = "pod.audioDeviceId";
            const LS_WATERMARK = "pod.optWatermark";
            const LS_VERTICAL = "pod.optVertical";

            // YouTube's recommended SDR upload bitrate for 1080p30 is 8 Mbps
            // video, 384 kbps stereo audio. Now that capture is uncapped the
            // video rate has to track the pixel count, or a 4K take arrives
            // starved and the downscale has nothing good to work from.
            const BASE_VIDEO_BITS = 8000000;
            const BASE_PIXELS = 1920 * 1080;
            // ceiling chosen against the server's UPLOAD_MAX_MB (256 MB):
            // 24 Mbps for MAX_SECONDS is ~180 MB, which leaves room.
            const MAX_VIDEO_BITS = 24000000;
            const AUDIO_BITS = 384000;
            const MAX_SECONDS = 60;
            const CAPTURE_FPS = 30;

            function videoBitsFor(settings) {
                const pixels = (settings.width || 1920) * (settings.height || 1080);
                const scaled = (BASE_VIDEO_BITS * pixels) / BASE_PIXELS;
                return Math.round(Math.min(MAX_VIDEO_BITS, Math.max(BASE_VIDEO_BITS, scaled)));
            }

            // Bare "video/mp4" first on purpose: naming a profile/level here
            // (avc1.42E01E is Baseline 3.0, which tops out at 720p30) can hand
            // the encoder a level the 1080p60 stream violates, and
            // isTypeSupported() will not catch it — it only checks the codec
            // family, not whether the level fits the stream you feed it.
            const MIME_CANDIDATES = [
                "video/mp4",
                "video/mp4;codecs=avc1.640028,mp4a.40.2",
                "video/mp4;codecs=h264,aac",
                "video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus",
                "video/webm",
            ];

            // Geometry mirrored from the backend so the take can be cropped and
            // downscaled before it is ever encoded — see verticalCrop,
            // fitVerticalSize and fitOutputSize in video-processor.ts. The server
            // still applies the same rules to whatever arrives, so this is an
            // optimisation rather than the authority: a file-picker upload, or a
            // browser without canvas capture, still gets sized correctly there.
            const OUT_MAX_SHORT_SIDE = 1080;
            const VERTICAL_ASPECT = 9 / 16;
            const toEven = (n) => Math.max(2, Math.round(n / 2) * 2);

            function outputGeometry(settings, vertical) {
                const width = settings.width || 1920;
                const height = settings.height || 1080;

                let crop = { x: 0, y: 0, width, height };
                if (vertical) {
                    const cw = Math.min(width, toEven(height * VERTICAL_ASPECT));
                    const ch = Math.min(height, toEven(cw / VERTICAL_ASPECT));
                    crop = {
                        x: Math.round((width - cw) / 2),
                        y: Math.round((height - ch) / 2),
                        width: cw,
                        height: ch,
                    };
                }

                let target;
                if (vertical) {
                    const w = toEven(Math.min(OUT_MAX_SHORT_SIDE, crop.width));
                    // clamped to the crop: the derived 9:16 height can ask for
                    // more rows than were cropped, and must not stretch them
                    target = {
                        width: w,
                        height: Math.min(toEven(crop.height), toEven(w / VERTICAL_ASPECT)),
                    };
                } else {
                    const fit = Math.min(1, OUT_MAX_SHORT_SIDE / Math.min(crop.width, crop.height));
                    target = {
                        width: toEven(crop.width * fit),
                        height: toEven(crop.height * fit),
                    };
                }
                return { crop, target };
            }

            let stream = null;
            // what MediaRecorder is actually fed: the canvas-scaled stream when
            // the browser can give us one, otherwise the camera stream itself
            let recordStream = null;
            let drawHandle = null;
            let drawViaFrameCallback = false;
            let recorder = null;
            let chunks = [];
            let timerId = null;
            let startedAt = 0;
            let stopWatchdog = null;
            let autoStopped = false;
            let finalizing = false;

            // ---- diagnostics ----

            function trackDiag(t) {
                const s = t.getSettings ? t.getSettings() : {};
                return {
                    kind: t.kind,
                    label: t.label,
                    readyState: t.readyState,
                    enabled: t.enabled,
                    // muted:true means the source is delivering no data. A track
                    // stuck like this is the usual reason stop() never finalizes.
                    muted: t.muted,
                    width: s.width,
                    height: s.height,
                    frameRate: s.frameRate,
                    sampleRate: s.sampleRate,
                };
            }

            function diag(label) {
                const info = {
                    at: label,
                    recorderState: recorder ? recorder.state : null,
                    mimeType: recorder ? recorder.mimeType : null,
                    chunks: chunks.length,
                    bytes: chunks.reduce((n, c) => n + c.size, 0),
                    scaled: recordStream !== null && recordStream !== stream,
                    tracks:
                        recordStream || stream
                            ? (recordStream || stream).getTracks().map(trackDiag)
                            : [],
                };
                console.log("[pod]", label, info);
                return info;
            }

            window.podDiag = diag;

            function setStatus(text, kind) {
                status.textContent = text;
                status.className = kind || "";
            }

            function setBlurred(on) {
                qrPlate.classList.toggle("blurred", on);
                blurBtn.setAttribute("aria-pressed", String(on));
                blurBtn.textContent = on ? "顯示 QR" : "隱藏 QR";
            }

            function toggleBlur() {
                setBlurred(!qrPlate.classList.contains("blurred"));
            }

            blurBtn.addEventListener("click", toggleBlur);
            // the plate is a mouse shortcut for the same action; keyboard and
            // screen-reader users get it through blurBtn
            qrPlate.addEventListener("click", toggleBlur);

            function showTab(record) {
                tabRecord.setAttribute("aria-selected", String(record));
                tabFile.setAttribute("aria-selected", String(!record));
                paneRecord.hidden = !record;
                paneFile.hidden = record;
            }

            tabRecord.addEventListener("click", () => showTab(true));
            tabFile.addEventListener("click", () => showTab(false));

            function pickMime() {
                if (typeof MediaRecorder === "undefined") return "";
                return MIME_CANDIDATES.find((t) => MediaRecorder.isTypeSupported(t)) || "";
            }

            function extFor(type) {
                return type.includes("mp4") ? "mp4" : "webm";
            }

            function formatSize(bytes) {
                const mb = bytes / 1048576;
                return mb >= 1024 ? (mb / 1024).toFixed(2) + " GB" : mb.toFixed(1) + " MB";
            }

            function stamp() {
                const d = new Date();
                const p = (n) => String(n).padStart(2, "0");
                return (
                    d.getFullYear() +
                    p(d.getMonth() + 1) +
                    p(d.getDate()) +
                    "-" +
                    p(d.getHours()) +
                    p(d.getMinutes()) +
                    p(d.getSeconds())
                );
            }

            // ---- auth: SSH-style challenge/response ----
            //
            // The server holds this client's public key; the private half never
            // leaves the browser. To upload we ask for a nonce, sign it, and
            // trade the signature for a short-lived bearer token. Everything
            // here mirrors services/auth-session.ts on the backend.

            let identity = null; // { fingerprint, comment, privateJwk }
            let signingKey = null; // the imported, non-extractable CryptoKey
            let session = null; // { token, expiresAt }
            let handshake = null; // in-flight handshake, shared by callers

            function base64(bytes) {
                let out = "";
                for (const b of new Uint8Array(bytes)) out += String.fromCharCode(b);
                return btoa(out);
            }

            function showIdentity(text, kind) {
                identityState.textContent = text;
                identityState.className = "keyinfo" + (kind ? " " + kind : "");
            }

            function setIdentity(next) {
                identity = next;
                // A different key invalidates anything derived from the old one.
                signingKey = null;
                session = null;
                handshake = null;

                if (!next) {
                    identityClear.disabled = true;
                    showIdentity("未載入金鑰，無法上傳。請選擇私鑰檔（例如 pod-key）。", "error");
                    return;
                }
                identityClear.disabled = false;
                showIdentity((next.comment ? next.comment + " · " : "") + next.fingerprint);
            }

            const SSH_KEY_TYPE = "ssh-ed25519";

            // The public half is what the *server* holds: it can check a
            // signature but not make one, so a .pub can never drive this page.
            // It is the easier file to reach for, though, so it gets its own
            // message rather than a generic parse failure.
            const PUBLIC_KEY_HINT =
                "這是公鑰（.pub），只能貼到伺服器的 authorized_keys。請改選同名、沒有 .pub 的私鑰檔。";

            function base64ToBytes(text) {
                const binary = atob(text.replace(/\s+/g, ""));
                const out = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);
                return out;
            }

            function bytesToBase64Url(bytes) {
                return base64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            }

            // OpenSSH writes everything as a 32-bit big-endian length followed
            // by that many bytes; the key file is nested runs of exactly that.
            function wireReader(bytes) {
                const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
                let offset = 0;

                const take = (length) => {
                    if (offset + length > bytes.length) throw new Error("私鑰檔已截斷");
                    const value = bytes.subarray(offset, offset + length);
                    offset += length;
                    return value;
                };
                const uint32 = () => {
                    if (offset + 4 > bytes.length) throw new Error("私鑰檔已截斷");
                    const value = view.getUint32(offset);
                    offset += 4;
                    return value;
                };
                const string = () => take(uint32());
                return { take, uint32, string, text: () => new TextDecoder().decode(string()) };
            }

            function wireString(bytes) {
                const out = new Uint8Array(4 + bytes.length);
                new DataView(out.buffer).setUint32(0, bytes.length);
                out.set(bytes, 4);
                return out;
            }

            // Hashing the blob an OpenSSH public key base64-encodes is what
            // produces the fingerprint `ssh-keygen -lf` prints, so the value on
            // screen can be checked against the key file by eye.
            async function sshFingerprint(rawPublicKey) {
                const type = new TextEncoder().encode(SSH_KEY_TYPE);
                const blob = new Uint8Array([...wireString(type), ...wireString(rawPublicKey)]);
                const digest = await crypto.subtle.digest("SHA-256", blob);
                return "SHA256:" + base64(digest).replace(/=+$/, "");
            }

            const OPENSSH_MAGIC = "openssh-key-v1\u0000";

            /**
             * Unpacks an unencrypted OpenSSH Ed25519 private key.
             *
             * After a magic string the container holds the cipher and KDF names,
             * the public key, and then a private section carrying two matching
             * check words, the 64-byte secret — a 32-byte seed followed by the
             * 32-byte public key — and the comment ssh-keygen was given.
             */
            async function identityFromOpenSshKey(text) {
                const body = text.match(
                    /-----BEGIN OPENSSH PRIVATE KEY-----([\s\S]+?)-----END OPENSSH PRIVATE KEY-----/,
                );
                if (!body) throw new Error("不是 OpenSSH 私鑰檔");

                const reader = wireReader(base64ToBytes(body[1]));
                if (new TextDecoder().decode(reader.take(OPENSSH_MAGIC.length)) !== OPENSSH_MAGIC) {
                    throw new Error("不是 OpenSSH 私鑰檔");
                }

                const cipher = reader.text();
                reader.text(); // kdf name
                reader.string(); // kdf options
                if (cipher !== "none") {
                    // Decrypting would mean implementing bcrypt_pbkdf in the
                    // page; pointing at ssh-keygen is the honest answer.
                    throw new Error(
                        '私鑰有密碼保護。請先用 ssh-keygen -p -N "" -f <私鑰> 移除密碼，或改用沒有密碼的金鑰。',
                    );
                }

                if (reader.uint32() !== 1) throw new Error("私鑰檔含有多把金鑰");
                reader.string(); // public key blob, repeated inside the private section

                const secret = wireReader(reader.string());
                if (secret.uint32() !== secret.uint32()) {
                    // Unequal check words mean the section is still encrypted.
                    throw new Error("私鑰有密碼保護，請先移除密碼。");
                }

                const keyType = secret.text();
                if (keyType !== SSH_KEY_TYPE) {
                    throw new Error(
                        `不支援的金鑰種類：${keyType}。請用 ssh-keygen -t ed25519 產生。`,
                    );
                }

                secret.string(); // public key, recovered from the secret below
                const keyPair = secret.string();
                if (keyPair.length !== 64) throw new Error("私鑰長度不正確");
                const comment = secret.text();

                const seed = keyPair.subarray(0, 32);
                const publicKey = keyPair.subarray(32);

                return {
                    fingerprint: await sshFingerprint(publicKey),
                    comment,
                    privateJwk: {
                        kty: "OKP",
                        crv: "Ed25519",
                        d: bytesToBase64Url(seed),
                        x: bytesToBase64Url(publicKey),
                    },
                };
            }

            /**
             * Accepts either an OpenSSH private key or the JSON this page saved
             * earlier, and rejects a public key with an explanation.
             */
            async function parseIdentity(text) {
                const trimmed = text.trim();

                if (trimmed.includes("BEGIN OPENSSH PRIVATE KEY")) {
                    return identityFromOpenSshKey(trimmed);
                }
                if (/^ssh-[a-z0-9-]+\s/i.test(trimmed)) {
                    throw new Error(PUBLIC_KEY_HINT);
                }
                if (trimmed.includes("BEGIN") && trimmed.includes("PRIVATE KEY")) {
                    throw new Error(
                        "這是 PEM 私鑰。請用 ssh-keygen -t ed25519 產生 OpenSSH 格式的金鑰。",
                    );
                }

                let parsed;
                try {
                    parsed = JSON.parse(trimmed);
                } catch {
                    throw new Error("認不得這個檔案。請選擇 ssh-keygen 產生的私鑰檔。");
                }

                const jwk = parsed && parsed.privateJwk;
                if (!parsed.fingerprint || !jwk || jwk.kty !== "OKP" || jwk.crv !== "Ed25519") {
                    throw new Error("不是有效的金鑰備份檔");
                }
                // "d" is the private scalar. Without it this is the public key
                // wearing the same shape, and importKey would reject it later
                // with nothing useful to say.
                if (!jwk.d) throw new Error(PUBLIC_KEY_HINT);

                return {
                    fingerprint: parsed.fingerprint,
                    comment: parsed.comment || "",
                    privateJwk: jwk,
                };
            }

            async function getSigningKey() {
                if (!signingKey) {
                    // extractable: false — once imported the key can sign but
                    // can no longer be read back out, not even by this page.
                    signingKey = await crypto.subtle.importKey(
                        "jwk",
                        identity.privateJwk,
                        { name: "Ed25519" },
                        false,
                        ["sign"],
                    );
                }
                return signingKey;
            }

            async function runHandshake(base) {
                const challengeRes = await fetch(base + "/auth/challenge", { cache: "no-store" });
                if (!challengeRes.ok) throw new Error("無法取得驗證挑戰碼");
                const { challenge } = await challengeRes.json();

                // Byte-for-byte the message challengeMessage() rebuilds server-side.
                const message = new TextEncoder().encode(
                    "pod-auth-v1\n" + challenge + "\n" + identity.fingerprint,
                );
                const signature = await crypto.subtle.sign(
                    "Ed25519",
                    await getSigningKey(),
                    message,
                );

                const verifyRes = await fetch(base + "/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fingerprint: identity.fingerprint,
                        challenge,
                        signature: base64(signature),
                    }),
                });
                if (verifyRes.status === 401) throw new Error("此金鑰未被伺服器授權");
                if (!verifyRes.ok) throw new Error("驗證失敗：" + verifyRes.status);

                const data = await verifyRes.json();
                return { token: data.token, expiresAt: data.expiresAt };
            }

            // Re-signs a minute before expiry so a long upload cannot start on a
            // token that dies mid-transfer. Parallel callers share one handshake
            // rather than each spending a challenge.
            async function authToken(base) {
                if (!identity) throw new Error("請先載入上傳金鑰");
                if (session && session.expiresAt - Date.now() > 60000) return session.token;

                if (!handshake) {
                    handshake = runHandshake(base)
                        .then((next) => {
                            session = next;
                            return next.token;
                        })
                        .finally(() => {
                            handshake = null;
                        });
                }
                return handshake;
            }

            // ---- upload + QR, shared by the recorder and the file picker ----

            async function uploadFile(file) {
                const base = apiBase.value.replace(/\/$/, "");
                const wantWatermark = optWatermark.checked;
                const wantVertical = optVertical.checked;

                const formData = new FormData();
                // flags first so multer has them parsed before the file body
                formData.append("watermark", wantWatermark ? "1" : "0");
                formData.append("vertical", wantVertical ? "1" : "0");
                formData.append("file", file);

                setStatus(
                    wantWatermark || wantVertical
                        ? "上傳中… " + formatSize(file.size) + "（伺服器合成需要一點時間）"
                        : "上傳中… " + formatSize(file.size),
                );
                result.hidden = true;

                const send = async (token) =>
                    fetch(base + "/", {
                        method: "POST",
                        headers: { Authorization: "Bearer " + token },
                        body: formData,
                    });

                let res = await send(await authToken(base));
                if (res.status === 401) {
                    // The server restarted, or the token aged out in flight;
                    // one fresh handshake tells the two cases apart from a key
                    // that is genuinely not authorized.
                    session = null;
                    res = await send(await authToken(base));
                }

                if (res.status === 401) {
                    throw new Error("未授權：此金鑰無法上傳");
                }
                if (res.status === 429) {
                    const wait = res.headers.get("Retry-After");
                    throw new Error("上傳太頻繁，請於 " + (wait || "數") + " 秒後再試");
                }
                if (!res.ok) {
                    throw new Error("Upload failed: " + res.status);
                }

                const data = await res.json();

                messageEl.textContent = data.message;
                idEl.textContent = data.id;

                const videoUrl = base + "/" + data.id;
                videoLink.href = videoUrl;
                videoLink.textContent = videoUrl;

                qrcodeDiv.innerHTML = "";
                setBlurred(false);
                new QRCode(qrcodeDiv, {
                    text: videoUrl,
                    // sized for scanning from ~0.7 m: phone cameras need
                    // roughly distance/10 of QR width, so ~7 cm ≈ 265 CSS px
                    // minimum — 340 leaves headroom on scaled displays.
                    width: 340,
                    height: 340,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H,
                });

                result.hidden = false;
                return data;
            }

            // ---- device list ----

            function fillSelect(sel, list, fallbackName, key) {
                const want = sel.value || localStorage.getItem(key) || "";
                sel.innerHTML = "";

                if (!list.length) {
                    const o = document.createElement("option");
                    o.value = "";
                    o.textContent = "找不到裝置";
                    sel.append(o);
                    return;
                }

                list.forEach((d, i) => {
                    const o = document.createElement("option");
                    o.value = d.deviceId;
                    // labels stay blank until the first getUserMedia grant
                    o.textContent = d.label || fallbackName + " " + (i + 1);
                    sel.append(o);
                });

                if (want && list.some((d) => d.deviceId === want)) sel.value = want;
            }

            async function refreshDevices() {
                let devices = [];
                try {
                    devices = await navigator.mediaDevices.enumerateDevices();
                } catch {
                    return;
                }
                fillSelect(
                    videoDevice,
                    devices.filter((d) => d.kind === "videoinput"),
                    "視訊裝置",
                    LS_VIDEO,
                );
                fillSelect(
                    audioDevice,
                    devices.filter((d) => d.kind === "audioinput"),
                    "音訊裝置",
                    LS_AUDIO,
                );
            }

            // after connecting, point the selects at what we actually got — the
            // browser may have ignored our request and handed back a default
            function syncSelectsToStream() {
                const apply = (sel, track, key) => {
                    if (!track) return;
                    const id = track.getSettings().deviceId;
                    if (!id) return;
                    // Persist what the track reports, NOT the select's read-back.
                    // Assigning a value with no matching <option> silently leaves
                    // .value as "", which would then overwrite the stored id with
                    // an empty string. Audio hits this and video does not, because
                    // Chrome adds "default"/"communications" pseudo-devices to the
                    // audio list whose ids need not match what getSettings() gives.
                    localStorage.setItem(key, id);
                    if ([...sel.options].some((o) => o.value === id)) sel.value = id;
                };
                apply(videoDevice, stream.getVideoTracks()[0], LS_VIDEO);
                apply(audioDevice, stream.getAudioTracks()[0], LS_AUDIO);
            }

            // ---- connect / disconnect ----

            function disconnect() {
                teardownRecordStream();
                if (stream) {
                    stream.getTracks().forEach((t) => t.stop());
                    stream = null;
                }
                preview.srcObject = null;
                previewWrap.classList.add("idle");
                previewWrap.style.removeProperty("--preview-ar");
                connectBtn.textContent = "連接相機";
                recordBtn.disabled = true;
                recState.textContent = "待機";
            }

            async function connect() {
                disconnect();

                const v = videoDevice.value;
                const a = audioDevice.value;

                setStatus("連接中…");
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        ...(v ? { deviceId: { exact: v } } : {}),
                        // No ceiling here: take the camera's best mode and let
                        // the backend downscale to 1080p afterwards. On a camera
                        // that pillarboxes a rotated take rather than changing
                        // resolution (Osmo Pocket), capturing 4K is what makes a
                        // real 1080x1920 possible at all — the 9:16 crop keeps
                        // 1216 columns of picture there against 608 from a 1080p
                        // capture. Frame rate stays capped: it costs file size
                        // without surviving into the deliverable.
                        width: { ideal: 3840 },
                        height: { ideal: 2160 },
                        frameRate: { ideal: CAPTURE_FPS, max: CAPTURE_FPS },
                    },
                    audio: {
                        ...(a ? { deviceId: { exact: a } } : {}),
                        // Chrome's voice processing is tuned for calls and wrecks
                        // podcast audio — take the raw capture instead
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });

                preview.srcObject = stream;
                preview.play().catch(() => {});
                previewWrap.classList.remove("idle");

                await refreshDevices();
                syncSelectsToStream();

                connectBtn.textContent = "中斷連接";
                recordBtn.disabled = false;

                const s = stream.getVideoTracks()[0].getSettings();
                if (s.width && s.height) {
                    previewWrap.style.setProperty("--preview-ar", s.width + " / " + s.height);
                }
                const mime = pickMime();
                const fmt = mime ? extFor(mime).toUpperCase() : "無編碼器";
                setStatus(
                    "已連接 " +
                        (s.width || "?") +
                        "×" +
                        (s.height || "?") +
                        " @" +
                        Math.round(s.frameRate || 0) +
                        "fps · " +
                        fmt,
                );
            }

            connectBtn.addEventListener("click", async () => {
                if (stream) {
                    disconnect();
                    setStatus("已中斷連接。");
                    return;
                }
                connectBtn.disabled = true;
                try {
                    await connect();
                } catch (err) {
                    disconnect();
                    setStatus("無法連接：" + err.message, "error");
                } finally {
                    connectBtn.disabled = false;
                }
            });

            // swapping source mid-session (Pocket 4 out, phone webcam in) just
            // re-acquires against the new selection
            async function onDeviceChanged(sel, key) {
                // before the first permission grant every deviceId is "" — do not
                // let that overwrite a good stored id
                if (sel.value) localStorage.setItem(key, sel.value);
                if (!stream) return;
                try {
                    await connect();
                } catch (err) {
                    disconnect();
                    setStatus("無法切換來源：" + err.message, "error");
                }
            }

            videoDevice.addEventListener("change", () => onDeviceChanged(videoDevice, LS_VIDEO));
            audioDevice.addEventListener("change", () => onDeviceChanged(audioDevice, LS_AUDIO));

            // ---- recording ----

            function clock(totalSeconds) {
                const p = (n) => String(n).padStart(2, "0");
                return p(Math.floor(totalSeconds / 60)) + ":" + p(Math.floor(totalSeconds % 60));
            }

            function resetMeter() {
                recTime.textContent = clock(0) + " / " + clock(MAX_SECONDS);
                recFill.style.width = "0%";
                recBar.classList.remove("warn");
            }

            function tick() {
                const ms = Date.now() - startedAt;
                const secs = Math.min(ms / 1000, MAX_SECONDS);
                recTime.textContent = clock(secs) + " / " + clock(MAX_SECONDS);
                recFill.style.width = Math.min(100, (ms / (MAX_SECONDS * 1000)) * 100) + "%";
                recBar.classList.toggle("warn", MAX_SECONDS - ms / 1000 <= 10);

                if (ms >= MAX_SECONDS * 1000 && recorder && recorder.state === "recording") {
                    autoStopped = true;
                    beginStop();
                }
            }

            // Frames go camera -> canvas -> encoder, so the crop and the 1080p
            // downscale happen before compression. That is what keeps the upload
            // small, and it also spares the take a generation of loss: the
            // picture is encoded once here instead of being encoded at capture
            // size and transcoded again on the server.
            function buildScaledStream(geom) {
                if (typeof scaler.captureStream !== "function") return null;

                const { crop, target } = geom;
                scaler.width = target.width;
                scaler.height = target.height;

                const ctx = scaler.getContext("2d", { alpha: false });
                if (!ctx) return null;

                const draw = () => {
                    ctx.drawImage(
                        preview,
                        crop.x,
                        crop.y,
                        crop.width,
                        crop.height,
                        0,
                        0,
                        target.width,
                        target.height,
                    );
                    scheduleDraw(draw);
                };
                draw();

                const canvasStream = scaler.captureStream(CAPTURE_FPS);
                if (!canvasStream.getVideoTracks().length) {
                    cancelDraw();
                    return null;
                }
                // the audio tracks stay the camera's own — only the picture is
                // rebuilt, so nothing is re-encoded twice on the way in
                return new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...stream.getAudioTracks(),
                ]);
            }

            // requestVideoFrameCallback fires once per decoded camera frame, so
            // the canvas neither duplicates nor drops one; rAF is the fallback
            // where it is missing.
            function scheduleDraw(fn) {
                if (typeof preview.requestVideoFrameCallback === "function") {
                    drawViaFrameCallback = true;
                    drawHandle = preview.requestVideoFrameCallback(fn);
                } else {
                    drawViaFrameCallback = false;
                    drawHandle = requestAnimationFrame(fn);
                }
            }

            function cancelDraw() {
                if (drawHandle === null) return;
                if (drawViaFrameCallback) preview.cancelVideoFrameCallback(drawHandle);
                else cancelAnimationFrame(drawHandle);
                drawHandle = null;
            }

            function teardownRecordStream() {
                cancelDraw();
                if (recordStream && recordStream !== stream) {
                    // only the canvas video track is ours to stop; the audio
                    // tracks belong to the camera stream and outlive the take
                    recordStream.getVideoTracks().forEach((t) => t.stop());
                }
                recordStream = null;
            }

            function startRecording() {
                const mimeType = pickMime();
                if (!mimeType) {
                    setStatus("此瀏覽器不支援錄影。", "error");
                    return;
                }

                const source = stream.getVideoTracks()[0].getSettings();
                const geom = outputGeometry(source, optVertical.checked);
                const scaled = buildScaledStream(geom);
                recordStream = scaled || stream;
                // bitrate has to match what is actually being encoded: the
                // scaled frame when the canvas path is live, the raw camera
                // frame when it is not
                const encoded = scaled ? geom.target : source;

                chunks = [];
                finalizing = false;
                autoStopped = false;
                recorder = new MediaRecorder(recordStream, {
                    mimeType,
                    videoBitsPerSecond: videoBitsFor(encoded),
                    audioBitsPerSecond: AUDIO_BITS,
                });
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size) {
                        chunks.push(e.data);
                        if (chunks.length <= 3 || chunks.length % 30 === 0) {
                            console.log("[pod] chunk", chunks.length, e.data.size + "B");
                        }
                    } else {
                        // empty chunks mean the encoder is producing nothing
                        console.warn("[pod] empty chunk at", chunks.length);
                    }
                };
                recorder.onerror = (e) => {
                    console.error("[pod] recorder error", e);
                    setStatus("錄影錯誤：" + ((e.error && e.error.message) || "unknown"), "error");
                };
                recorder.onstop = () => {
                    console.log("[pod] onstop fired");
                    onRecordingStopped();
                };
                // a timeslice keeps chunks flowing instead of building one giant
                // buffer, and limits what a mid-take crash can lose
                recorder.start(1000);
                diag("start");

                startedAt = Date.now();
                resetMeter();
                timerId = setInterval(tick, 250);

                recBar.classList.add("live");
                recState.textContent = "錄影中";
                recordBtn.textContent = "停止錄影";
                connectBtn.disabled = true;
                videoDevice.disabled = true;
                audioDevice.disabled = true;
                setStatus(
                    "錄影中… " +
                        encoded.width +
                        "×" +
                        encoded.height +
                        " · " +
                        (recorder.mimeType || mimeType),
                );
            }

            // Chrome can wedge inside stop() — most often when one track has
            // stopped delivering samples and the muxer waits forever to
            // finalize. Salvage the take instead of stranding it.
            function beginStop() {
                setStatus(autoStopped ? "已達 1 分鐘上限，處理中…" : "處理中…");
                recordBtn.disabled = true;
                diag("stop:requested");

                try {
                    if (recorder.state === "recording") recorder.requestData();
                } catch (err) {
                    console.warn("[pod] requestData failed", err);
                }

                stopWatchdog = setTimeout(() => {
                    const info = diag("stop:watchdog");
                    console.warn("[pod] onstop did not fire within 8s", info);
                    setStatus(
                        "停止逾時 — 正在搶救 " + info.chunks + " 段（見 console）。",
                        "error",
                    );
                    onRecordingStopped();
                }, 8000);

                recorder.stop();
            }

            async function onRecordingStopped() {
                // the watchdog and a late-arriving onstop must not both run this
                if (finalizing) return;
                finalizing = true;
                clearTimeout(stopWatchdog);
                clearInterval(timerId);
                diag("finalize");

                teardownRecordStream();

                recBar.classList.remove("live");
                resetMeter();
                recState.textContent = "待機";
                recordBtn.textContent = "開始錄影";
                recordBtn.disabled = true;

                const type = recorder.mimeType || pickMime() || "video/webm";
                const ext = extFor(type);
                const blob = new Blob(chunks, { type });
                chunks = [];

                try {
                    if (!blob.size) throw new Error("錄影內容是空的");
                    await uploadFile(
                        new File([blob], "recording-" + stamp() + "." + ext, { type }),
                    );
                    setStatus(
                        ext === "mp4" ? "上傳完成。" : "上傳完成（WebM — iPhone 可能無法播放）。",
                        "done",
                    );
                } catch (err) {
                    console.error("[pod] finalize failed", err);
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    finalizing = false;
                    recordBtn.disabled = !stream;
                    connectBtn.disabled = false;
                    videoDevice.disabled = false;
                    audioDevice.disabled = false;
                }
            }

            recordBtn.addEventListener("click", () => {
                if (recorder && recorder.state === "recording") {
                    beginStop();
                } else if (stream) {
                    startRecording();
                }
            });

            // ---- file picker (unchanged behaviour, now sharing uploadFile) ----

            uploadBtn.addEventListener("click", async () => {
                const file = videoFile.files[0];
                if (!file) {
                    setStatus("請先選擇影片檔案。", "error");
                    return;
                }

                uploadBtn.disabled = true;
                try {
                    await uploadFile(file);
                    setStatus("上傳完成。", "done");
                } catch (err) {
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    uploadBtn.disabled = false;
                }
            });

            // ---- init ----

            function syncPreviewOverlays() {
                wmPreview.hidden = !optWatermark.checked;
                cropFrame.classList.toggle("vertical", optVertical.checked);
            }

            function bindToggle(el, key, after) {
                el.checked = localStorage.getItem(key) === "1";
                el.addEventListener("change", () => {
                    localStorage.setItem(key, el.checked ? "1" : "0");
                    if (after) after();
                });
            }

            identityFile.addEventListener("change", async () => {
                const file = identityFile.files[0];
                if (!file) return;
                try {
                    const next = await parseIdentity(await file.text());
                    // Kept locally so the key survives a reload; it is only ever
                    // sent to the browser's own crypto, never to the server.
                    localStorage.setItem(LS_IDENTITY, JSON.stringify(next));
                    setIdentity(next);
                } catch (err) {
                    showIdentity("金鑰讀取失敗：" + err.message, "error");
                } finally {
                    // Clearing the picker lets the same file be re-selected.
                    identityFile.value = "";
                }
            });

            identityClear.addEventListener("click", () => {
                localStorage.removeItem(LS_IDENTITY);
                setIdentity(null);
            });

            identityTest.addEventListener("click", async () => {
                identityTest.disabled = true;
                try {
                    session = null;
                    await authToken(apiBase.value.replace(/\/$/, ""));
                    setStatus("金鑰驗證成功，可以上傳。", "done");
                } catch (err) {
                    setStatus("錯誤：" + err.message, "error");
                } finally {
                    identityTest.disabled = false;
                }
            });

            (async function restoreIdentity() {
                const stored = localStorage.getItem(LS_IDENTITY);
                if (!stored) return setIdentity(null);
                try {
                    setIdentity(await parseIdentity(stored));
                } catch {
                    // A stored blob that no longer parses is worse than none.
                    localStorage.removeItem(LS_IDENTITY);
                    setIdentity(null);
                }
            })();

            bindToggle(optWatermark, LS_WATERMARK, syncPreviewOverlays);
            bindToggle(optVertical, LS_VERTICAL, syncPreviewOverlays);
            syncPreviewOverlays();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                // getUserMedia needs a secure context: file:// will not do
                connectBtn.disabled = true;
                showTab(false);
                setStatus("無法存取相機：請用 http://localhost 或 HTTPS 開啟本頁。", "error");
            } else {
                navigator.mediaDevices.addEventListener("devicechange", refreshDevices);
                refreshDevices().then(() => {
                    if (!videoDevice.options[0] || !videoDevice.options[0].textContent.trim())
                        return;
                    if (!videoDevice.value) setStatus("按「連接相機」以授權並列出裝置。");
                });
            }
        </script>
    </body>
</html>
